name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          INSTALLER_P12_PASSWORD: ${{ secrets.INSTALLER_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "BUILD_CERTIFICATE_BASE64 is required for a release." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/codex-call-signing.keychain-db"
          APP_CERT_PATH="$RUNNER_TEMP/application.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$APP_CERT_PATH"
          security import "$APP_CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          if [ -n "${INSTALLER_CERTIFICATE_BASE64:-}" ]; then
            INSTALLER_CERT_PATH="$RUNNER_TEMP/installer.p12"
            printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"
            security import "$INSTALLER_CERT_PATH" -P "${INSTALLER_P12_PASSWORD:-$P12_PASSWORD}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v

      - name: Build signed installer package
        env:
          REQUIRE_SIGNING: "1"
        run: |
          chmod +x app/build.sh installer/build-pkg.sh installer/scripts/preinstall installer/scripts/postinstall native/driver/build.sh native/helper/build.sh
          installer/build-pkg.sh

      - name: Verify code and package signatures
        run: |
          codesign --verify --deep --strict --verbose=2 "app/build/Codex Call.app"
          pkgutil --check-signature dist/CodexCall-*.pkg | grep "Developer ID Installer:"

      - name: Notarize and staple installer
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APPSTORE_PRIVATE_KEY:-}" ]; then
            echo "APPSTORE_PRIVATE_KEY is required for a release." >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          PKG_PATH=$(find dist -maxdepth 1 -name 'CodexCall-*.pkg' -print -quit)
          xcrun notarytool submit "$PKG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPSTORE_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --wait
          xcrun stapler staple "$PKG_PATH"
          xcrun stapler validate "$PKG_PATH"
          shasum -a 256 "$PKG_PATH" > "$PKG_PATH.sha256"

      - name: Verify Gatekeeper assessment
        run: |
          PKG_PATH=$(find dist -maxdepth 1 -name 'CodexCall-*.pkg' -print -quit)
          spctl --assess --type install --verbose=2 "$PKG_PATH"
          pkgutil --check-signature "$PKG_PATH"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CodexCall-*.pkg
            dist/CodexCall-*.pkg.sha256
          generate_release_notes: true
