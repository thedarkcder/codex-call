name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "No signing certificate secret set; building unsigned."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

      - name: Build driver, helper and app
        run: |
          chmod +x native/driver/build.sh native/helper/build.sh app/build.sh app/install-app.sh
          app/build.sh

      - name: Verify signature
        run: |
          codesign --verify --verbose=2 "app/build/Codex Call.app" || true
          codesign -dv "app/build/Codex Call.app" 2>&1 | grep -E "Identifier|Authority" || true

      - name: Package
        run: |
          cd "app/build"
          ditto -c -k --keepParent "Codex Call.app" CodexCall-macos.zip
          shasum -a 256 CodexCall-macos.zip > CodexCall-macos.zip.sha256
          cat CodexCall-macos.zip.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/CodexCall-macos.zip
            app/build/CodexCall-macos.zip.sha256
          generate_release_notes: true
